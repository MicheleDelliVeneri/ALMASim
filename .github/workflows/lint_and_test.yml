name: Run tests

on:
  schedule:
    - cron: '19 3 * * 1-5'
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API types are current
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts src/lib/api/v2/schema.d.ts

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npx prettier --check src

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep the built app for the package job
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: frontend/build
          retention-days: 3

  # The console end to end (web console plan, U3.9): the built app served by
  # a real `almasim serve`, its commands replaced by instant stand-ins
  # (frontend/e2e), driven by Playwright, every page checked with axe.
  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get the built app
        uses: actions/download-artifact@v7
        with:
          name: web-app
          path: frontend/build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install almasim with the web extra
        run: uv sync --extra web --no-default-groups

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the test tools
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        env:
          ALMASIM: ${{ github.workspace }}/.venv/bin/almasim
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx playwright test

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/test-results
          retention-days: 7

  # The wheel carries the web app (hatch_build.py), and an install of it
  # serves it: `almasim serve` on a cluster needs no Node.
  package:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get the built app
        uses: actions/download-artifact@v7
        with:
          name: web-app
          path: frontend/build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build the distributions, the app required
        run: uv build
        env:
          ALMASIM_REQUIRE_WEB: "1"

      - name: The wheel holds the app
        run: python scripts/check_web_wheel.py dist/*.whl

      - name: An install of the wheel serves it
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python "$(ls dist/*.whl)[web]" httpx
          cd /tmp && /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/scripts/check_web_wheel.py" --serve

  tests:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --no-default-groups --group test

      - name: Run unit tests
        run: uv run pytest --rootdir ${{ github.workspace }}

  tests-and-coverage:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-default-groups --group test

      - name: Run tests with coverage
        run: >-
          uv run pytest --cov=src/almasim --cov=backend/app --cov-report=xml
          --rootdir ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
