# Alembic configuration for the ALMASim backend database (MADIV-28 T6.3).
# The application upgrades the database at startup (app.db.migrate); by hand:
#   cd backend && alembic upgrade head
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
