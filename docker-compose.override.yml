# Development additions to docker-compose.yml; `docker compose up` loads this
# file automatically. The backend and frontend reload on source changes.

services:
  backend:
    volumes:
      # Mount source code for hot reload (no rebuild needed on code changes)
      - ./backend/app:/app/backend/app
      - ./src:/app/src
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
      --reload-dir /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: almasim-frontend
    image: almasim-frontend:dev
    environment:
      - NODE_ENV=development
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
      - ./frontend/svelte.config.js:/app/svelte.config.js
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # Exclude node_modules from volume mount
      - /app/node_modules
      - /app/.svelte-kit
