# Development additions to docker-compose.yml; `docker compose up` loads this
# file automatically. The web app reloads on source changes; the console runs
# the mounted source (restart it to pick up Python changes).

services:
  console:
    volumes:
      # The project is installed editable, so the mounted source is what runs.
      - ./src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: almasim-frontend
    image: almasim-frontend:dev
    environment:
      - NODE_ENV=development
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # Exclude node_modules from volume mount
      - /app/node_modules
      - /app/.svelte-kit
