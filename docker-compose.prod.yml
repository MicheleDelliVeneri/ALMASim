# Production settings on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# (`make start-prod`). The frontend runs its production build, and the
# development override (hot reload) is not loaded.

services:
  postgres:
    container_name: almasim-postgres-prod

  backend:
    container_name: almasim-backend-prod
    environment:
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: almasim-frontend-prod
    image: almasim-frontend:prod
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
