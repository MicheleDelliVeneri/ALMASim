# The services shared by development and production.
#
#   docker compose up                       development: this file plus
#                                           docker-compose.override.yml (hot reload)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#                                           production builds and resource limits
#
# `make start` and `make start-prod` run these.

services:
  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    container_name: almasim-postgres
    environment:
      - POSTGRES_USER=almasim
      - POSTGRES_PASSWORD=almasim_dev_password
      - POSTGRES_DB=almasim
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almasim -d almasim"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - almasim-network

  # Backend FastAPI service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: almasim-backend
    image: almasim-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MAIN_DIR=/app/src/almasim
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
      - TNG_DIR=/app/data/TNG100-1
      - GALAXY_ZOO_DIR=/app/data/galaxy_zoo
      - HUBBLE_DIR=/app/data/hubble
      - DATABASE_URL=postgresql://almasim:almasim_dev_password@postgres:5432/almasim
      # Request paths must lie under HOST_DIR, OUTPUT_DIR, DATA_DIR or these extra
      # roots (JSON list), and Dask schedulers be DASK_SCHEDULER or listed here.
      # - ALLOWED_ROOTS=["/SKAO_data"]
      # - ALLOWED_SCHEDULERS=["tcp://scheduler-host:8786"]
    volumes:
      # Mount data directory for persistence (read-only for safety)
      - ./data:/app/data:ro
      # Mount outputs directory for simulation results
      - ./backend/outputs:/app/outputs
      # Mount host home directory so downloads land on the host filesystem
      - ${HOME}:/host_home
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - almasim-network

  # Frontend SvelteKit service (the build differs between the two modes)
  frontend:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The address the browser uses for the API (read per request by
      # frontend/src/hooks.server.ts and injected into the page).
      - API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {if(r.statusCode !== 200 && r.statusCode !== 304) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - almasim-network

# dask-docker-compose.yml joins this network as almasim_almasim-network.
networks:
  almasim-network:
    driver: bridge

volumes:
  postgres_data:
