# The web console on a laptop, in two containers: the console (`almasim
# serve`, API v2) and the web app's server, which forwards /api to it.
#
#   docker compose up                       development: this file plus
#                                           docker-compose.override.yml (hot reload)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#                                           production builds and resource limits
#
# Then open http://localhost:3000. `make start` and `make start-prod` run these.
# On a cluster, use `almasim serve` itself instead (docs/console.md).

services:
  # The web console. Without Slurm here, it runs every command in this
  # container with the server executor (examples/site-profiles/laptop.toml);
  # runs land in the console_runs volume.
  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    image: almasim-console:latest
    container_name: almasim-console
    working_dir: /app
    command: ["almasim", "serve", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - ALMASIM_SITE_PROFILE=/app/examples/site-profiles/laptop.toml
      # Listen beyond the container's loopback; the host publishes the port on
      # 127.0.0.1 only. The token is fixed so the frontend can be given it:
      # set ALMASIM_TOKEN in your shell or .env to change it.
      - ALMASIM_SERVE_HOST=0.0.0.0
      - ALMASIM_TOKEN=${ALMASIM_TOKEN:-almasim-laptop-console}
    volumes:
      - ./examples:/app/examples:ro
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - console_runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:8765/api/v2/health', headers={'Authorization': 'Bearer ' + os.environ['ALMASIM_TOKEN']}))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - almasim-network

  # The web app (the build differs between the two modes); it forwards /api
  # to the console with the console's token (vite.config.ts).
  frontend:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - ALMASIM_API_URL=http://console:8765
      - ALMASIM_TOKEN=${ALMASIM_TOKEN:-almasim-laptop-console}
    depends_on:
      console:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {if(r.statusCode !== 200 && r.statusCode !== 304) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - almasim-network

# dask-docker-compose.yml joins this network as almasim_almasim-network.
networks:
  almasim-network:
    driver: bridge

volumes:
  console_runs:
