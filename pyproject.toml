[project]
name = "almasim"
version = "2.1.16"
description = "An ALMA Simulation package for a more civilized era."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Michele Delli Veneri", email = "micheledelliveneri@gmail.com"},
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "httpx",
    "pyvo",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "scipy",
    "h5py",
    "kaggle",
    "kagglehub",
    "dask",
    "dask-jobqueue",
    "distributed",
    "astromartini",
    "Hdecompose",  # not imported directly: martini needs it for TNG sources
    "paramiko",
    "pysftp",
    "tenacity",
    "nifty8",
    "scikit-image",
    "imagecodecs",  # not imported directly: image decoding for the dataset sky models
    "ducc0",
    "typer",
    "pypdf>=6.19.0",
]

[project.scripts]
almasim = "almasim.cli:main"

[project.optional-dependencies]
# The Dask dashboard the CLI links to (distributed serves it only with bokeh).
dashboard = ["bokeh>=3.9.0"]
casa = ["casatools", "casatasks"]
ms-casacore = ["python-casacore"]

[project.urls]
Repository = "https://github.com/astromadiv/ALMASim"
Homepage = "https://github.com/astromadiv/ALMASim"
Documentation = "https://astromadiv.github.io/ALMASim/"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy>=2.1.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "sqlalchemy>=2.0.0",
    "ipykernel>=7.2.0",
    "marimo[lsp]>=0.10",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "myst-parser>=5.1.0",
    "sphinx-copybutton>=0.5.2",
]
test = [
    "pytest",
    "pytest-cov",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almasim"]

[tool.ruff]
line-length = 100
exclude = ["node_modules", ".venv", "build", "htmlcov", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
"examples/ImagingWithDucc0.py" = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src/almasim", "backend/app"]
mypy_path = ["src", "backend"]
explicit_package_bases = true
ignore_missing_imports = true

# Baseline (MADIV-28 T0.1): these modules had type errors when mypy was first
# enabled in CI. Remove a module from this list once its errors are fixed.
[[tool.mypy.overrides]]
module = [
    "app.api.v1.routers.download",
    "app.api.v1.routers.imaging",
    "app.api.v1.routers.simulation",
    "app.services.metadata_service",
    "almasim.cli",
    "almasim.cli_image",
    "almasim.cli_simulation",
    "almasim.scheduling.cluster",
    "almasim.services.archive.calibrate_ms",
    "almasim.services.archive.qa0",
    "almasim.services.astro.spectral",
    "almasim.services.compute.dask",
    "almasim.services.compute.factory",
    "almasim.services.compute.kubernetes",
    "almasim.services.external_skymodel",
    "almasim.services.imaging.selfcal.loop",  # moved out of archive_imaging
    "almasim.services.imaging.task",  # moved out of archive_imaging
    "almasim.services.imaging.ms.chunks",  # moved out of archive_imaging
    "almasim.services.imaging.reconstruction",
    "almasim.services.interferometry.core",
    "almasim.services.interferometry.imaging",
    "almasim.services.interferometry.utils",
    "almasim.skymodels.datasets.tng",
    "almasim.skymodels.serendipitous",
    # Surfaced when SQLAlchemy joined the test group (T1.12): the models use
    # untyped Column attributes rather than Mapped[].
    "app.db.models",
    "app.db.service",
    "app.db.startup",
]
ignore_errors = true

[tool.uv]
package = true

[tool.uv.workspace]
members = ["backend"]
